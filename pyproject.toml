[project]
name = "customer-support-env"
version = "0.1.0"
description = "Customer support simulation environment"
authors = [{name = "Fenil and Ridham"}]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"